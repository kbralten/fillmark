name: Build Release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version Code (defaults to github.run_number)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests and Release Lint
        run: ./gradlew testDebugUnitTest lintRelease --no-daemon

      - name: Decode Release Keystore (if configured)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"
          echo "RELEASE_STORE_FILE=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"

      - name: Determine Version Properties
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            echo "code=${{ github.event.inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.version_name || '1.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release App Bundle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}
          --no-daemon

      - name: Upload AAB and R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: fillmark-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
