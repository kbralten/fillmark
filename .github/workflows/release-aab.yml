name: Build Release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version Code (defaults to github.run_number)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests, AndroidTest Compile, and Release Lint
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintRelease --no-daemon

      - name: Validate and Decode Release Keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          is_tag=false
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            is_tag=true
          fi

          missing=()
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing+=("RELEASE_KEYSTORE_BASE64")
          [ -z "$RELEASE_STORE_PASSWORD" ] && missing+=("RELEASE_STORE_PASSWORD")
          [ -z "$RELEASE_KEY_ALIAS" ] && missing+=("RELEASE_KEY_ALIAS")
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing+=("RELEASE_KEY_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "$is_tag" = true ]; then
              echo "::error::Tagged release builds require all signing secrets. Missing: ${missing[*]}"
              exit 1
            elif [ "${#missing[@]}" -lt 4 ]; then
              echo "::error::Partial release signing configuration detected. Missing: ${missing[*]}"
              exit 1
            else
              echo "No signing secrets configured for manual workflow_dispatch; building unsigned verification bundle."
              echo "require_signing=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"
          if [ ! -s "${{ runner.temp }}/release.keystore" ]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi
          echo "RELEASE_STORE_FILE=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
          echo "require_signing=true" >> "$GITHUB_OUTPUT"

      - name: Determine Version Properties
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            echo "code=${{ github.event.inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.version_name || '1.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Release App Bundle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease
          -PversionCode=${{ steps.version.outputs.code }}
          -PversionName=${{ steps.version.outputs.name }}
          -PrequireReleaseSigning=${{ steps.signing.outputs.require_signing }}
          --no-daemon

      - name: Upload AAB and R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: fillmark-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
