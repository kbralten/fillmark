<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fillmark — Local-First Hydration Tracker for Android</title>
  <link rel="icon" type="image/png" href="icon-512.png">
  <style>
    :root {
      --bg: #f6f9fb;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0d1e32;
      --muted: #556677;
      --accent: #007a87;
      --on-accent: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #091420;
        --surface: #0f1e2e;
        --border: #1b3145;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #20d2de;
        --on-accent: #091420;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      max-width: 600px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--border);
      color: var(--accent);
    }
    a.primary {
      background: var(--accent);
      color: var(--on-accent);
      border-color: transparent;
    }
  </style>
</head>
<body>
  <main>
    <img src="icon-512.png" alt="Fillmark icon">
    <h1>Fillmark</h1>
    <p>A lightweight, local-first, privacy-respecting drink and hydration tracker for Android with home screen widgets, waking-hours pacing, and optional Health Connect sync.</p>
    <div class="links">
      <a class="primary" href="privacy.html">Privacy Policy</a>
      <a href="https://github.com/kbralten/fillmark/issues">GitHub Issues</a>
      <a href="mailto:fillmark@bralten.ca">fillmark@bralten.ca</a>
    </div>
  </main>
</body>
</html>
